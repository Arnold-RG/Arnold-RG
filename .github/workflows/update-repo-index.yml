name: Update repository index

# Keeps the "All public repositories" table and the repo count current,
# so a new public repository shows up on the profile within a few hours.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repo-index
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repo_index.py
      - name: Commit if changed
        run: |
          git config user.name "Arnold Rurangwa"
          git config user.email "137049568+Arnold-RG@users.noreply.github.com"
          git add README.md assets/stats.svg
          if git diff --staged --quiet; then echo "No changes."; else git commit -m "Update repository index"; git push; fi
