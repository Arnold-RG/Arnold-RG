name: Update profile dashboard

on:
  schedule:
    # Every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-dashboard
  cancel-in-progress: true

jobs:
  update:
    name: Refresh dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_dashboard.py

      - name: Commit if the dashboard changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard README.md assets/header.svg
          if git diff --staged --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "Refresh public work dashboard"
            git push
          fi
