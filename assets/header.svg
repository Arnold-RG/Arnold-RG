<path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0d1117" stop-opacity="0.15"/>
<stop offset="40%" stop-color="#0d1117" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#0d1117" stop-opacity="0.92"/>
</linearGradient>
<style>
