.caret{animation:blink 1.1s step-end infinite;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.t1{animation:cycle 9s infinite;}
.t2{animation:cycle 9s infinite 4.5s; opacity:0;}
